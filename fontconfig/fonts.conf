<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <match>
    <test name="family" compare="contains">
      <string>mono</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Ricty</string>
    </edit>
  </match>

  <match>
    <test name="family" compare="contains">
      <string>sans</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Koruri</string>
    </edit>
  </match>

  <match>
    <test name="family" compare="contains">
      <string>serif</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Koruri</string>
    </edit>
  </match>

  <match>
    <test name="family" compare="contains">
      <string>system</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Koruri</string>
    </edit>
  </match>

  <match>
    <test name="family" compare="contains">
      <string>ui</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Koruri</string>
    </edit>
  </match>

  <match>
    <test name="family" compare="contains">
      <string>Ricty</string>
    </test>
    <edit name="weight" mode="assign" binding="strong">
      <const>bold</const>
    </edit>
  </match>

  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/Adwaita/*</glob>
      <glob>/usr/share/fonts/noto*/NotoSerif*</glob>
    </rejectfont>
  </selectfont>

</fontconfig>
